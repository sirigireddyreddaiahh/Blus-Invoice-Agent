_schema-version: '3.1'
ID: blus-invoice-agent
version: 1.0.0
description: "Blus Invoice Agent: Invoice Fraud & Duplicate Engine with Read-only AI Assistant"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  # ----------------- DB DEPLOYER -----------------
  - name: blus-invoice-agent-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: blus-invoice-agent-db-hdi
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}

  # ----------------- CAP SERVICE -----------------
  - name: blus-invoice-agent-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      ALLOW_INVOICE_DATA_TO_LLM: "false"
      CLIENT_DB_LOOKUP_ENABLED: "false"
      TESSDATA_PATH: "/home/vcap/app"
      SAP_MODE: "live"
      SAP_API_URL: "https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SUPPLIERINVOICE_PROCESS_SRV"
    requires:
      - name: blus-invoice-agent-db-hdi
      - name: blus-invoice-agent-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ----------------- APPROUTER -----------------
  - name: blus-invoice-agent-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: blus-invoice-agent-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # ----------------- HANA HDI CONTAINER -----------------
  - name: blus-invoice-agent-db-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}

  # ----------------- XSUAA AUTH -----------------
  - name: blus-invoice-agent-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: blus-invoice-agent-${space}
        tenant-mode: dedicated
