_schema-version: '3.1'
ID: ap-sentinel
version: 1.0.0
description: "AP Sentinel: SAP BTP Invoice Fraud & Duplicate Engine with Read-only AI Assistant"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  # ----------------- DB DEPLOYER -----------------
  - name: ap-sentinel-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ap-sentinel-db-hdi
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}

  # ----------------- CAP SERVICE -----------------
  - name: ap-sentinel-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      ALLOW_INVOICE_DATA_TO_LLM: "false"
      CLIENT_DB_LOOKUP_ENABLED: "false"
      TESSDATA_PATH: "/home/vcap/app"
    requires:
      - name: ap-sentinel-db-hdi
      - name: ap-sentinel-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ----------------- APPROUTER -----------------
  - name: ap-sentinel-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: ap-sentinel-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # ----------------- HANA HDI CONTAINER -----------------
  - name: ap-sentinel-db-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        # Obtain GUID with: cf service ap-sentinel-db --guid (never use the instance name)
        database_id: "00000000-0000-4000-8000-000000000000"
    properties:
      hdi-container-name: ${service-name}

  # ----------------- XSUAA AUTH -----------------
  - name: ap-sentinel-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ap-sentinel-${space}
        tenant-mode: dedicated
